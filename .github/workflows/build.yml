name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilation macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Versions de la toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Construire le bundle
        run: ./build.sh release

      - name: Verifier la signature et les entitlements
        run: |
          codesign --verify --verbose=2 MExplorer.app
          codesign --display --entitlements - MExplorer.app
